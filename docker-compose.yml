# Optional: run Postgres in Docker instead of using a local install.
# Maps to host port 5433 to avoid clashing with a local Postgres on 5432.
# Then set in backend/.env:
#   DATABASE_URL=postgresql+asyncpg://chati:chati@127.0.0.1:5433/chati
services:
  postgres:
    image: postgres:18
    container_name: seafor-postgres
    environment:
      POSTGRES_USER: chati
      POSTGRES_PASSWORD: chati
      POSTGRES_DB: chati
    ports:
      - "5433:5432"
    volumes:
      - seafor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chati"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seafor-pgdata:
